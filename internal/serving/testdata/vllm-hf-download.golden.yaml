apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    aibox.dev/load-method: hf-download
    aibox.dev/revision: 0123456789abcdef0123456789abcdef01234567
  labels:
    aibox.dev/model: vllm-hf
    aibox.dev/runtime: vllm
    app.kubernetes.io/part-of: aibox
  name: vllm-hf
  namespace: aibox-serving
spec:
  labels:
    aibox.dev/model: vllm-hf
    aibox.dev/runtime: vllm
    app.kubernetes.io/part-of: aibox
  model:
    name: vllm-hf
    uri: hf://org/vllm-hf
  parallelism:
    tensor: 1
  replicas: 1
  storageInitializer:
    enabled: false
  template:
    containers:
    - args:
      - org/vllm-hf
      - --served-model-name
      - vllm-hf
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "8192"
      - --shutdown-timeout
      - "280"
      - --gpu-memory-utilization
      - "0.9"
      - --max-num-seqs
      - "64"
      - --kv-cache-dtype
      - fp8
      - --no-enable-prefix-caching
      - --no-enable-chunked-prefill
      - --quantization
      - fp8
      - --revision
      - 0123456789abcdef0123456789abcdef01234567
      - --seed
      - "1"
      command:
      - vllm
      - serve
      env:
      - name: AIBOX_MODEL_ID
        value: vllm-hf
      - name: AIBOX_STARTUP_TIMEOUT
        value: "1800"
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            key: token
            name: hf-token
            optional: true
      image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
      lifecycle:
        postStart:
          exec:
            command:
            - python3
            - -c
            - |
              # postStart hook of AIBox model servers: wait until the server is healthy, then send one
              # 1-token completion. Kubernetes starts no probes before the hook returns, so the server
              # becomes ready only after its weights are loaded and a request succeeded.
              import json, os, sys, time, urllib.request  # noqa: E401

              base = "http://127.0.0.1:8000"
              deadline = time.time() + float(os.environ.get("AIBOX_STARTUP_TIMEOUT", "1800"))
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(base + "/health", timeout=5) as r:
                          if r.status == 200:
                              break
                  except Exception:
                      pass
                  time.sleep(5)
              else:
                  sys.exit("model server not healthy before the startup timeout")
              body = json.dumps({"model": os.environ["AIBOX_MODEL_ID"], "prompt": "Hello", "max_tokens": 1}).encode()
              req = urllib.request.Request(base + "/v1/completions", data=body, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  if r.status != 200:
                      sys.exit(f"warm-up request failed: HTTP {r.status}")
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 10
        timeoutSeconds: 5
      name: main
      ports:
      - containerPort: 8000
        name: http
        protocol: TCP
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        limits:
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
      startupProbe:
        failureThreshold: 180
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 10
        timeoutSeconds: 5
    nodeSelector:
      aibox.dev/gpu-class: gpu-l4
    securityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: model-server
    terminationGracePeriodSeconds: 300
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
