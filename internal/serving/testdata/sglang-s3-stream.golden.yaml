apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    aibox.dev/load-method: s3-stream
    aibox.dev/revision: 0123456789abcdef0123456789abcdef01234567
  labels:
    aibox.dev/model: sglang-s3
    aibox.dev/runtime: sglang
    app.kubernetes.io/part-of: aibox
  name: sglang-s3
  namespace: aibox-serving
spec:
  labels:
    aibox.dev/model: sglang-s3
    aibox.dev/runtime: sglang
    app.kubernetes.io/part-of: aibox
  model:
    name: sglang-s3
    uri: hf://org/sglang-s3
  parallelism:
    tensor: 1
  replicas: 1
  storageInitializer:
    enabled: false
  template:
    containers:
    - args:
      - -m
      - sglang.launch_server
      - --model-path
      - s3://$(AIBOX_WEIGHTS_BUCKET)/models/sglang-s3/0123456789abcdef0123456789abcdef01234567/
      - --served-model-name
      - sglang-s3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tp-size
      - "1"
      - --context-length
      - "8192"
      - --enable-metrics
      - --mem-fraction-static
      - "0.9"
      - --max-running-requests
      - "64"
      - --kv-cache-dtype
      - fp8_e4m3
      - --disable-radix-cache
      - --chunked-prefill-size
      - "-1"
      - --quantization
      - fp8
      - --load-format
      - runai_streamer
      - --seed
      - "1"
      command:
      - python3
      env:
      - name: AIBOX_MODEL_ID
        value: sglang-s3
      - name: AIBOX_STARTUP_TIMEOUT
        value: "1800"
      - name: AIBOX_WEIGHTS_BUCKET
        valueFrom:
          configMapKeyRef:
            key: weightsBucket
            name: aibox-run
            optional: true
      - name: AWS_REGION
        valueFrom:
          configMapKeyRef:
            key: region
            name: aibox-run
            optional: true
      image: lmsysorg/sglang:v0.5.23@sha256:f832b5c39559c9caa900b22ad37c76fcce66470676855c42052102c537812f1f
      lifecycle:
        postStart:
          exec:
            command:
            - python3
            - -c
            - |
              # postStart hook of AIBox model servers: wait until the server is healthy, then send one
              # 1-token completion. Kubernetes starts no probes before the hook returns, so the server
              # becomes ready only after its weights are loaded and a request succeeded.
              import json, os, sys, time, urllib.request  # noqa: E401

              base = "http://127.0.0.1:8000"
              deadline = time.time() + float(os.environ.get("AIBOX_STARTUP_TIMEOUT", "1800"))
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(base + "/health", timeout=5) as r:
                          if r.status == 200:
                              break
                  except Exception:
                      pass
                  time.sleep(5)
              else:
                  sys.exit("model server not healthy before the startup timeout")
              body = json.dumps({"model": os.environ["AIBOX_MODEL_ID"], "prompt": "Hello", "max_tokens": 1}).encode()
              req = urllib.request.Request(base + "/v1/completions", data=body, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  if r.status != 200:
                      sys.exit(f"warm-up request failed: HTTP {r.status}")
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 10
        timeoutSeconds: 5
      name: main
      ports:
      - containerPort: 8000
        name: http
        protocol: TCP
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        limits:
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
      startupProbe:
        failureThreshold: 180
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 10
        timeoutSeconds: 5
    nodeSelector:
      aibox.dev/gpu-class: gpu-l4
    securityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: model-server
    terminationGracePeriodSeconds: 300
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
