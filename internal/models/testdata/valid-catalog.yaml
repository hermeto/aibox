apiVersion: aibox.dev/v1alpha1
kind: ModelCatalog
models:
  - id: m1
    enabled: true
    profiles: [local]
    source: {type: huggingface, repo: org/m1, revision: "0123456789abcdef0123456789abcdef01234567"}
    license: apache-2.0
    gated: false
    quantization: bf16
    tensorParallelSize: 1
    maxModelLen: 4096
    minGPUClass: gpu-l4
    runtime: vllm
    loadMethod: s3-stream
    slo: {ttftP99Ms: 1000, itlP99Ms: 100}
