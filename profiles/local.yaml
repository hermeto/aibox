# yaml-language-server: $schema=../schemas/profile.schema.json
apiVersion: aibox.dev/v1alpha1
kind: Profile
metadata:
  name: local
  description: kind cluster on a laptop or CI runner; no GPU (llm-d inference simulator).
spec:
  provider: kind
  cluster:
    name: aibox-local
    kubernetesVersion: "1.37"
  local:
    minCPUs: 4
    minMemoryGiB: 6
    recommendedMemoryGiB: 8
  guardrails:
    ttl: 24h
  gateway:
    rateLimits:
      default: {requestsPerMinute: 600, tokensPerMinute: 1000000}
      # Low limits for the e2e tests (test/e2e adds keys for these clients).
      clients:
        e2e-requests: {requestsPerMinute: 3, tokensPerMinute: 1000000}
        e2e-tokens: {requestsPerMinute: 600, tokensPerMinute: 40}
