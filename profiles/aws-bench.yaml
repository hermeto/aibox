# yaml-language-server: $schema=../schemas/profile.schema.json
apiVersion: aibox.dev/v1alpha1
kind: Profile
metadata:
  name: aws-bench
  description: Official benchmark runs on L4, A10G and H100 (EC2 Capacity Block).
spec:
  provider: aws
  cluster:
    name: aibox-bench
    kubernetesVersion: "1.34"
  aws:
    region: us-east-1
    gpuClasses:
      - name: gpu-l4
        instanceTypes: [g6.xlarge, g6.12xlarge]
        capacityType: on-demand
        maxNodes: 2
      - name: gpu-a10g
        instanceTypes: [g5.xlarge, g5.12xlarge]
        capacityType: on-demand
        maxNodes: 2
      - name: gpu-h100
        instanceTypes: [p5.48xlarge]
        capacityType: capacity-block
        maxNodes: 1
        # Set to your reservation before a run (see docs/runbooks/benchmark-campaign.md).
        capacityReservationId: cr-00000000000000000
  guardrails:
    ttl: 4h
