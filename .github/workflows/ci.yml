name: ci

on:
  pull_request: # any base branch, so stacked PRs are checked too
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make tools
      - run: make lint
      - name: Images pinned by digest
        run: make check-image-digests

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test

  cli:
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build for all release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/aibox
          done
      - run: make build
      - name: aibox doctor --profile local
        run: ./bin/aibox doctor --profile local --output json | tee doctor.json | jq -e '.ok == true'
      - name: Unimplemented commands exit 2
        run: |
          set +e
          ./bin/aibox bench --profile local
          code=$?
          test "$code" -eq 2

  e2e-local:
    name: e2e-local
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KIND_VERSION: v0.33.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2
      - name: Install kind
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: up → up (idempotent) → smoke
        env:
          AIBOX_E2E_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          AIBOX_E2E_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          AIBOX_E2E_KEEP: "1"
        run: go test -tags e2e ./test/e2e/... -run TestLocalPlatform -timeout 30m -count=1 -v
      - name: Running images (digests)
        if: always()
        run: |
          kubectl --context kind-aibox-local get pods -A \
            -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.image}{"  "}{.imageID}{"\n"}{end}{end}' | sort -u || true
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-aibox-local get applications -n argocd -o yaml || true
          kubectl --context kind-aibox-local get pods -A -o wide || true
          kubectl --context kind-aibox-local get events -A --sort-by=.lastTimestamp | tail -n 100 || true
      - name: down
        if: always()
        run: go run ./cmd/aibox down --profile local

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.8
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: fmt, validate, test (mocked providers, no credentials)
        run: make terraform-check
      - name: tflint (AWS ruleset)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make terraform-lint

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            build
            perf
            revert
            style

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: hack/ci/dco-check.sh "$BASE_SHA" "$HEAD_SHA"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The dependency graph is a repository setting. While it is disabled the action
      # cannot run at all; the check then warns loudly (see issue #2) and enforces
      # automatically as soon as the maintainer enables the setting.
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/${REPO}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" >/dev/null 2>err.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not supported|not enabled|dependency graph' err.txt; then
            echo "::warning title=dependency-review::Dependency graph is disabled for ${REPO}; enable it in Settings → Code security (tracked in a needs-human issue). Review skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (vulnerabilities, secrets)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE"
          fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --skip-dirs '**/.terraform' .
      - name: Trivy config scan (IaC, workflows, manifests)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE"
          config --severity HIGH,CRITICAL --exit-code 1
          --ignorefile .trivyignore.yaml --skip-dirs '**/.terraform' .

  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, test, cli, e2e-local, terraform, pr-title, dco, dependency-review, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: hack/ci
      - name: Evaluate required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ github.event_name == 'pull_request' && '' || 'pr-title,dco,dependency-review' }}
        run: hack/ci/ci-gate.sh "$NEEDS" "$ALLOWED_SKIPS"
