name: Documentation
description: Something in the docs is missing, wrong or unclear.
labels: ["kind/docs", "area/docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: docs/runbooks/aws-first-run.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
