# Gateway API keys from the secret store (key aibox/aibox-dev/api-keys: a JSON object of client id ->
# key), merged into the Secret aibox-api-keys that `aibox up` creates with the CLI's own key.
# Missing keys are not an error (deletion and creation policy Merge).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aibox-api-keys
  namespace: aibox-gateway
  annotations:
    # After the ClusterSecretStore (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aibox
  target:
    name: aibox-api-keys
    creationPolicy: Merge
    deletionPolicy: Merge
  dataFrom:
    - extract:
        key: aibox/aibox-dev/api-keys
