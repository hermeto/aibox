# AWS Secrets Manager in the cluster's region; credentials come from the operator's EKS Pod
# Identity role, which may read aibox/<cluster>/* only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aibox
  annotations:
    # After the operator and its CRDs (wave 0 of this Application) are healthy.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
