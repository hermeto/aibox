# Local secret store: the ESO fake provider holding no Hugging Face token (the local models are
# public), like a cloud account without aibox/<cluster>/hf-token: the hf-token ExternalSecret
# then resolves to no Secret and the sync Jobs download anonymously. The fake provider rejects
# empty values, so add an entry here only with a real token in a local, uncommitted copy.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aibox
  annotations:
    # After the operator and its CRDs (wave 0 of this Application) are healthy.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    fake:
      data: []
