# Local secret store: the ESO fake provider with an empty Hugging Face token (the local models
# are public). Cloud profiles read AWS Secrets Manager instead.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aibox
  annotations:
    # After the operator and its CRDs (wave 0 of this Application) are healthy.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    fake:
      data:
        - key: aibox/aibox-local/hf-token
          value: ""
