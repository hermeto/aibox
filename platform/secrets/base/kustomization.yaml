# External Secrets Operator: copies secrets (the Hugging Face token) from the profile's secret
# store into Kubernetes Secrets. Each overlay defines the ClusterSecretStore "aibox".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.14.0
    releaseName: external-secrets
    namespace: external-secrets
    includeCRDs: true
    valuesInline:
      installCRDs: true
      # Bound to an IAM role by EKS Pod Identity (infra/terraform/aws/modules/iam).
      serviceAccount:
        name: external-secrets
      image:
        tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
      webhook:
        image:
          tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      certController:
        image:
          tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
