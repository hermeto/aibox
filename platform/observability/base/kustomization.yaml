# Observability (ADR-0011): kube-prometheus-stack (Prometheus with 24 h retention,
# Alertmanager, Grafana, kube-state-metrics, node-exporter) as the metrics backend; Tempo
# (traces) and Loki (logs) in single-binary mode; one OpenTelemetry Collector Deployment for
# OTLP traces and one DaemonSet that ships pod logs. Prometheus scrapes metrics directly through
# ServiceMonitors/PodMonitors (recorded in ADR-0011 as the "simplest" choice); the Collector is
# used where it adds value.
#
# The namespace is created by the bootstrap Application (CreateNamespace=true).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
helmCharts:
  - name: kube-prometheus-stack
    repo: oci://ghcr.io/prometheus-community/charts
    version: 92.20.0
    releaseName: monitoring
    namespace: observability
    includeCRDs: true
    valuesInline:
      crds:
        enabled: true
      grafana:
        enabled: true
        # Dashboards come from git (ConfigMaps), not from the chart's defaults.
        defaultDashboardsEnabled: false
        # No helm-test pod: it pulls an extra (unpinned) bats image; e2e tests cover Grafana.
        testFramework:
          enabled: false
        additionalDataSources:
          - name: Tempo
            uid: tempo
            type: tempo
            access: proxy
            url: http://tempo.observability.svc.cluster.local:3200
            jsonData:
              tracesToLogsV2:
                datasourceUid: loki
                spanStartTimeShift: -1m
                spanEndTimeShift: 1m
                filterByTraceID: true
                filterBySpanID: true
              serviceMap:
                datasourceUid: prometheus
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.observability.svc.cluster.local:3100
            jsonData:
              derivedFields:
                - datasourceUid: tempo
                  matcherType: regex
                  matcherRegex: 'trace_id=([0-9a-f]+)'
                  name: TraceID
                  url: '$${__value.raw}'
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: ALL
            provider:
              allowUiUpdates: false
          datasources:
            enabled: true
            label: grafana_datasource
            labelValue: "1"
        # The admin password is generated by the chart and stored in the `monitoring-grafana`
        # Secret; `aibox up` prints how to read it (no default password in git).
        service:
          type: ClusterIP
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
      prometheus:
        prometheusSpec:
          retention: 24h
          scrapeInterval: 15s
          # Select monitors and rules in every namespace (our monitors live in `observability`
          # and watch `aibox-serving`, `aibox-gateway`, `envoy-gateway-system`, ...).
          podMonitorSelectorNilUsesHelmValues: false
          serviceMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
      alertmanager:
        enabled: true
        alertmanagerSpec:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      prometheusOperator:
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
      kube-state-metrics:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      node-exporter:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      prometheus-node-exporter:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
  - name: tempo
    repo: oci://ghcr.io/grafana/helm-charts
    version: 1.24.4
    releaseName: tempo
    namespace: observability
    valuesInline:
      tempo:
        retention: 24h
        reportingEnabled: false
        storage:
          trace:
            backend: local
            local:
              path: /var/tempo/traces
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
      persistence:
        enabled: false
      serviceMonitor:
        enabled: false
  - name: loki
    repo: oci://ghcr.io/grafana/helm-charts
    version: 7.5.0
    releaseName: loki
    namespace: observability
    valuesInline:
      deploymentMode: SingleBinary
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem
        schemaConfig:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        limits_config:
          retention_period: 24h
        compactor:
          retention_enabled: true
          delete_request_store: filesystem
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
      singleBinary:
        replicas: 1
        persistence:
          enabled: false
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
      read:
        replicas: 0
      write:
        replicas: 0
      backend:
        replicas: 0
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      lokiCanary:
        enabled: false
      test:
        enabled: false
      gateway:
        enabled: true
  - name: opentelemetry-collector
    repo: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
    version: 0.178.2
    releaseName: otel-traces
    namespace: observability
    valuesInline:
      mode: deployment
      fullnameOverride: otel-traces
      image:
        repository: otel/opentelemetry-collector-contrib
      replicaCount: 1
      config:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        processors:
          memory_limiter:
            check_interval: 5s
            limit_percentage: 80
            spike_limit_percentage: 20
          batch: {}
        exporters:
          otlp/tempo:
            endpoint: tempo.observability.svc.cluster.local:4317
            tls:
              insecure: true
        service:
          pipelines:
            traces:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [otlp/tempo]
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
  - name: opentelemetry-collector
    repo: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
    version: 0.178.2
    releaseName: otel-logs
    namespace: observability
    valuesInline:
      mode: daemonset
      fullnameOverride: otel-logs
      image:
        repository: otel/opentelemetry-collector-contrib
      presets:
        logsCollection:
          enabled: true
          includeCollectorLogs: false
        kubernetesAttributes:
          enabled: true
      config:
        processors:
          batch: {}
        exporters:
          otlphttp/loki:
            endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        service:
          pipelines:
            logs:
              receivers: [filelog]
              processors: [k8sattributes, batch]
              exporters: [otlphttp/loki]
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
# Every image in the rendered stack pinned by digest (constitution principle II). Digests were
# resolved from the registries at implementation time; `make check-image-digests` enforces it.
images:
  - name: docker.io/grafana/grafana
    digest: sha256:540b8afb775bf34aefce417e4329039daa5d44b6f2fbda6881397b1b247ca7df
  - name: docker.io/grafana/loki
    digest: sha256:44148ad243c07957113baea950ee5ba9b0c8eff8d7e38ff3cc1c0af705790945
  - name: docker.io/grafana/tempo
    digest: sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
  - name: docker.io/kiwigrid/k8s-sidecar
    digest: sha256:a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df
  - name: quay.io/kiwigrid/k8s-sidecar
    digest: sha256:52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
  - name: docker.io/nginxinc/nginx-unprivileged
    digest: sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
  - name: ghcr.io/jkroepke/kube-webhook-certgen
    digest: sha256:778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082
  - name: otel/opentelemetry-collector-contrib
    digest: sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
  - name: quay.io/prometheus-operator/prometheus-operator
    digest: sha256:c7edf0379b7271ef1705dce258d2bb73820e299cc95559369e9f6fc3321639ec
  - name: quay.io/prometheus/node-exporter
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    digest: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
configMapGenerator:
  - name: aibox-dashboards
    files:
      - dashboards/slo.json
      - dashboards/capacity.json
      - dashboards/gpu.json
      - dashboards/cost.json
      - dashboards/scaling.json
    options:
      labels:
        grafana_dashboard: "1"
resources:
  - monitors.yaml
