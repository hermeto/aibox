# Unit tests for the generated alerts (promtool test rules). Run from the repository root:
#   promtool test rules platform/observability/rules/tests/*.yaml
# The rule file is generated by `aibox render rules`; if a threshold or expression changes,
# update this file and `make generate` together.
rule_files:
  - ../local.rules.yaml
evaluation_interval: 1m
tests:
  - name: kv-cache saturation fires after five minutes
    interval: 1m
    input_series:
      - series: 'vllm:kv_cache_usage_perc{model_name="sim-llama-8b",namespace="aibox-serving"}'
        values: '0.95x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: AIBoxKVCacheSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              model: sim-llama-8b
              namespace: aibox-serving
            exp_annotations:
              summary: KV cache of sim-llama-8b above 90% for 5 minutes
              description: KV-cache usage is 95%; requests queue and get preempted. Add replicas or lower max sequences.

  - name: kv-cache below the threshold does not fire
    interval: 1m
    input_series:
      - series: 'vllm:kv_cache_usage_perc{model_name="sim-llama-8b",namespace="aibox-serving"}'
        values: '0.50x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AIBoxKVCacheSaturated
        exp_alerts: []

  - name: pending pods fire after five minutes
    interval: 1m
    input_series:
      - series: 'kube_pod_status_phase{phase="Pending",pod="sim-llama-8b-0",namespace="aibox-serving"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: AIBoxPodsPending
        exp_alerts:
          - exp_labels:
              severity: warning
              pod: sim-llama-8b-0
              namespace: aibox-serving
            exp_annotations:
              summary: aibox-serving/sim-llama-8b-0 pending for more than 5 minutes
              description: Check capacity (Karpenter NodeClaims, GPU quotas) and the pod's events.

  - name: gpu node idle fires after thirty minutes
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL{node="ip-10-0-1-2",gpu="0"}'
        values: '0x35'
    alert_rule_test:
      - eval_time: 31m
        alertname: AIBoxGPUNodeIdle
        exp_alerts:
          - exp_labels:
              severity: info
              node: ip-10-0-1-2
            exp_annotations:
              summary: GPU node ip-10-0-1-2 idle for 30 minutes
              description: No GPU on the node did any work for 30 minutes; it still costs money.
