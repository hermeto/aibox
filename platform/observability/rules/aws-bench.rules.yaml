    record: aibox:instance_price_usd_per_hour
  - expr: vector(0.8048)
    labels:
      capacity_type: capacity-block
      instance_type: g6.xlarge
    record: aibox:instance_price_usd_per_hour
  - expr: vector(0.2016)
    labels:
      capacity_type: on-demand
      instance_type: m7i.xlarge
    record: aibox:instance_price_usd_per_hour
  - expr: vector(0.08)
    labels:
      capacity_type: spot
      instance_type: m7i.xlarge
    record: aibox:instance_price_usd_per_hour
  - expr: vector(0.2016)
    labels:
      capacity_type: capacity-block
      instance_type: m7i.xlarge
    record: aibox:instance_price_usd_per_hour
  - expr: vector(55.04)
    labels:
      capacity_type: on-demand
      instance_type: p5.48xlarge
    record: aibox:instance_price_usd_per_hour
  - expr: vector(22)
    labels:
      capacity_type: spot
      instance_type: p5.48xlarge
    record: aibox:instance_price_usd_per_hour
  - expr: vector(31.464)
    labels:
      capacity_type: capacity-block
      instance_type: p5.48xlarge
    record: aibox:instance_price_usd_per_hour
  - expr: max by (node, instance_type, capacity_type, pool) (label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(kube_node_labels,
      "instance_type", "$1", "label_node_kubernetes_io_instance_type", "(.+)"), "capacity_type",
      "$1", "label_karpenter_sh_capacity_type", "(.+)"), "capacity_type", "on-demand",
      "capacity_type", ""), "capacity_type", "capacity-block", "capacity_type", "reserved"),
      "pool", "$1", "label_eks_amazonaws_com_nodegroup", "(.+)"), "pool", "$1", "label_karpenter_sh_nodepool",
      "(.+)")) * on (instance_type, capacity_type) group_left () aibox:instance_price_usd_per_hour
    record: aibox:node_price_usd_per_hour
  - expr: sum by (pool) (aibox:node_price_usd_per_hour)
    record: aibox:pool_cost_usd_per_hour
  - expr: sum(aibox:node_price_usd_per_hour) + 0.145
    record: aibox:cluster_cost_usd_per_hour
  - expr: sum by (namespace, pod, node) (kube_pod_container_resource_requests{resource="nvidia_com_gpu"})
      / on (node) group_left () sum by (node) (kube_node_status_allocatable{resource="nvidia_com_gpu"})
    record: aibox:pod_gpu_share
  - expr: sum by (namespace, model) (label_replace(aibox:pod_gpu_share * on (namespace,
      pod) group_left (label_aibox_dev_model) max by (namespace, pod, label_aibox_dev_model)
      (kube_pod_labels{label_aibox_dev_model!=""}), "model", "$1", "label_aibox_dev_model",
      "(.+)") * on (node) group_left () max by (node) (aibox:node_price_usd_per_hour))
    record: aibox:model_cost_usd_per_hour
  - expr: aibox:model_cost_usd_per_hour / on (namespace, model) (aibox:generation_tokens_total:rate1m
      * 3600 > 0) * 1e6
    record: aibox:usd_per_million_output_tokens
  - expr: aibox:cluster_cost_usd_per_hour / (sum(aibox:generation_tokens_total:rate1m)
      * 3600 > 0) * 1e6
    record: aibox:cluster_usd_per_million_output_tokens
- name: aibox-alerts
  rules:
  - alert: AIBoxTTFTSLOViolation
    annotations:
      description: TTFT p99 is {{ $value | humanizeDuration }} in {{ $labels.namespace
        }} (target from models/catalog.yaml).
      summary: TTFT p99 of qwen2.5-72b-awq above its 3000 ms target
    expr: aibox:time_to_first_token_seconds:p99{model="qwen2.5-72b-awq"} > 3
    for: 10m
    labels:
      model: qwen2.5-72b-awq
      severity: warning
  - alert: AIBoxTTFTSLOViolation
    annotations:
      description: TTFT p99 is {{ $value | humanizeDuration }} in {{ $labels.namespace
        }} (target from models/catalog.yaml).
      summary: TTFT p99 of qwen3-32b-fp8 above its 2000 ms target
    expr: aibox:time_to_first_token_seconds:p99{model="qwen3-32b-fp8"} > 2
    for: 10m
    labels:
      model: qwen3-32b-fp8
      severity: warning
  - alert: AIBoxTTFTSLOViolation
    annotations:
      description: TTFT p99 is {{ $value | humanizeDuration }} in {{ $labels.namespace
        }} (target from models/catalog.yaml).
      summary: TTFT p99 of qwen3-8b above its 1000 ms target
    expr: aibox:time_to_first_token_seconds:p99{model="qwen3-8b"} > 1
    for: 10m
    labels:
      model: qwen3-8b
      severity: warning
  - alert: AIBoxKVCacheSaturated
    annotations:
      description: KV-cache usage is {{ $value | humanizePercentage }}; requests queue
        and get preempted. Add replicas or lower max sequences.
      summary: KV cache of {{ $labels.model }} above 90% for 5 minutes
    expr: aibox:kv_cache_usage_ratio > 0.9
    for: 5m
    labels:
      severity: warning
  - alert: AIBoxPodsPending
    annotations:
      description: Check capacity (Karpenter NodeClaims, GPU quotas) and the pod's
        events.
      summary: '{{ $labels.namespace }}/{{ $labels.pod }} pending for more than 5
        minutes'
    expr: sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0
    for: 5m
    labels:
      severity: warning
  - alert: AIBoxGPUNodeIdle
    annotations:
      description: No GPU on the node did any work for 30 minutes; it still costs
        money.
      summary: GPU node {{ $labels.node }} idle for 30 minutes
    expr: max by (node) (DCGM_FI_DEV_GPU_UTIL) == 0
    for: 30m
    labels:
      severity: info
  - alert: AIBoxPriceMissing
    annotations:
      description: Add the instance type to data/pricing and run `make generate`.
      summary: 'No price for {{ $labels.instance_type }} ({{ $labels.capacity_type
        }}): cost series are incomplete'
    expr: count by (instance_type, capacity_type) (label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(kube_node_labels,
      "instance_type", "$1", "label_node_kubernetes_io_instance_type", "(.+)"), "capacity_type",
      "$1", "label_karpenter_sh_capacity_type", "(.+)"), "capacity_type", "on-demand",
      "capacity_type", ""), "capacity_type", "capacity-block", "capacity_type", "reserved"),
      "pool", "$1", "label_eks_amazonaws_com_nodegroup", "(.+)"), "pool", "$1", "label_karpenter_sh_nodepool",
      "(.+)") unless on (instance_type, capacity_type) aibox:instance_price_usd_per_hour)
      > 0
    for: 10m
    labels:
      severity: warning
