# Generated by `aibox render rules` from metrics/runtime-metrics.yaml, data/pricing, models/catalog.yaml and profiles/local.yaml — do not edit.
# Regenerate with `make generate`; CI fails on drift.
groups:
- interval: 15s
  name: aibox-runtime
  rules:
  - expr: sum by (namespace, model) (label_replace(vllm:num_requests_waiting, "model",
      "$1", "model_name", "(.*)")) or sum by (namespace, model) (label_replace(sglang:num_queue_reqs,
      "model", "$1", "model_name", "(.*)"))
    record: aibox:requests_waiting
  - expr: sum by (namespace, model) (label_replace(vllm:num_requests_running, "model",
      "$1", "model_name", "(.*)")) or sum by (namespace, model) (label_replace(sglang:num_running_reqs,
      "model", "$1", "model_name", "(.*)"))
    record: aibox:requests_running
  - expr: avg by (namespace, model) (label_replace(vllm:kv_cache_usage_perc, "model",
      "$1", "model_name", "(.*)")) or avg by (namespace, model) (label_replace(sglang:token_usage,
      "model", "$1", "model_name", "(.*)"))
    record: aibox:kv_cache_usage_ratio
  - expr: sum by (namespace, model, le) (label_replace(rate(vllm:time_to_first_token_seconds_bucket[1m]),
      "model", "$1", "model_name", "(.*)")) or sum by (namespace, model, le) (label_replace(rate(sglang:time_to_first_token_seconds_bucket[1m]),
      "model", "$1", "model_name", "(.*)"))
    record: aibox:time_to_first_token_seconds_bucket:rate1m
  - expr: histogram_quantile(0.50, sum by (namespace, model, le) (aibox:time_to_first_token_seconds_bucket:rate1m))
    record: aibox:time_to_first_token_seconds:p50
  - expr: histogram_quantile(0.95, sum by (namespace, model, le) (aibox:time_to_first_token_seconds_bucket:rate1m))
    record: aibox:time_to_first_token_seconds:p95
  - expr: histogram_quantile(0.99, sum by (namespace, model, le) (aibox:time_to_first_token_seconds_bucket:rate1m))
    record: aibox:time_to_first_token_seconds:p99
  - expr: sum by (namespace, model, le) (label_replace(rate(vllm:inter_token_latency_seconds_bucket[1m]),
      "model", "$1", "model_name", "(.*)")) or sum by (namespace, model, le) (label_replace(rate(sglang:inter_token_latency_seconds_bucket[1m]),
      "model", "$1", "model_name", "(.*)"))
    record: aibox:inter_token_latency_seconds_bucket:rate1m
  - expr: histogram_quantile(0.50, sum by (namespace, model, le) (aibox:inter_token_latency_seconds_bucket:rate1m))
    record: aibox:inter_token_latency_seconds:p50
  - expr: histogram_quantile(0.95, sum by (namespace, model, le) (aibox:inter_token_latency_seconds_bucket:rate1m))
    record: aibox:inter_token_latency_seconds:p95
  - expr: histogram_quantile(0.99, sum by (namespace, model, le) (aibox:inter_token_latency_seconds_bucket:rate1m))
    record: aibox:inter_token_latency_seconds:p99
  - expr: sum by (namespace, model, le) (label_replace(rate(vllm:e2e_request_latency_seconds_bucket[1m]),
      "model", "$1", "model_name", "(.*)")) or sum by (namespace, model, le) (label_replace(rate(sglang:e2e_request_latency_seconds_bucket[1m]),
      "model", "$1", "model_name", "(.*)"))
    record: aibox:e2e_request_latency_seconds_bucket:rate1m
  - expr: histogram_quantile(0.50, sum by (namespace, model, le) (aibox:e2e_request_latency_seconds_bucket:rate1m))
    record: aibox:e2e_request_latency_seconds:p50
  - expr: histogram_quantile(0.95, sum by (namespace, model, le) (aibox:e2e_request_latency_seconds_bucket:rate1m))
    record: aibox:e2e_request_latency_seconds:p95
  - expr: histogram_quantile(0.99, sum by (namespace, model, le) (aibox:e2e_request_latency_seconds_bucket:rate1m))
    record: aibox:e2e_request_latency_seconds:p99
  - expr: sum by (namespace, model) (label_replace(rate(vllm:prompt_tokens_total[1m]),
      "model", "$1", "model_name", "(.*)")) or sum by (namespace, model) (label_replace(rate(sglang:prompt_tokens_total[1m]),
      "model", "$1", "model_name", "(.*)"))
    record: aibox:prompt_tokens_total:rate1m
  - expr: sum by (namespace, model) (label_replace(rate(vllm:generation_tokens_total[1m]),
      "model", "$1", "model_name", "(.*)")) or sum by (namespace, model) (label_replace(rate(sglang:generation_tokens_total[1m]),
      "model", "$1", "model_name", "(.*)"))
    record: aibox:generation_tokens_total:rate1m
  - expr: sum by (namespace, model) (label_replace(rate(vllm:request_success_total[1m]),
      "model", "$1", "model_name", "(.*)")) or sum by (namespace, model) (label_replace(rate(sglang:num_requests_total[1m]),
      "model", "$1", "model_name", "(.*)"))
    record: aibox:requests_finished_total:rate1m
- name: aibox-alerts
  rules:
  - alert: AIBoxTTFTSLOViolation
    annotations:
      description: TTFT p99 is {{ $value | humanizeDuration }} in {{ $labels.namespace
        }} (target from models/catalog.yaml).
      summary: TTFT p99 of sim-llama-8b above its 1000 ms target
    expr: aibox:time_to_first_token_seconds:p99{model="sim-llama-8b"} > 1
    for: 10m
    labels:
      model: sim-llama-8b
      severity: warning
  - alert: AIBoxKVCacheSaturated
    annotations:
      description: KV-cache usage is {{ $value | humanizePercentage }}; requests queue
        and get preempted. Add replicas or lower max sequences.
      summary: KV cache of {{ $labels.model }} above 90% for 5 minutes
    expr: aibox:kv_cache_usage_ratio > 0.9
    for: 5m
    labels:
      severity: warning
  - alert: AIBoxPodsPending
    annotations:
      description: Check capacity (Karpenter NodeClaims, GPU quotas) and the pod's
        events.
      summary: '{{ $labels.namespace }}/{{ $labels.pod }} pending for more than 5
        minutes'
    expr: sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0
    for: 5m
    labels:
      severity: warning
  - alert: AIBoxGPUNodeIdle
    annotations:
      description: No GPU on the node did any work for 30 minutes; it still costs
        money.
      summary: GPU node {{ $labels.node }} idle for 30 minutes
    expr: max by (node) (DCGM_FI_DEV_GPU_UTIL) == 0
    for: 30m
    labels:
      severity: info
