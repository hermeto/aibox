apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Expose the sample model on the host (kind maps NodePort 30080 to 127.0.0.1:30080).
  # Feature 009 moves this port to the gateway.
  - target:
      kind: Service
      name: sim-llama-8b
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
