# Model servers: each overlay holds the LLMInferenceServices generated from the catalog
# (`aibox render serving`, models.yaml) for its profile.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aibox-serving
resources:
  - serviceaccount.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: aibox
      app.kubernetes.io/component: serving
    includeSelectors: false
