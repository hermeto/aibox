# Sample model served by the llm-d inference simulator (OpenAI-compatible, vLLM metrics).
# Feature 008 replaces this hand-written manifest with catalog-rendered runtimes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-llama-8b
  labels:
    app.kubernetes.io/name: sim-llama-8b
    aibox.dev/model: sim-llama-8b
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sim-llama-8b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sim-llama-8b
        aibox.dev/model: sim-llama-8b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.1.0@sha256:012cf6aa414cfbb910743274458dd62c0c0a9d469eb2ba2b28fd5b963516447d
          args:
            - --model=sim-llama-8b
            - --port=8000
            - --mode=random
            - --seed=42
            - --max-num-seqs=8
            - --max-model-len=8192
            - --time-to-first-token=200ms
            - --inter-token-latency=20ms
            - --enable-kvcache
            - --kv-cache-size=1024
            - --block-size=16
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sim-llama-8b
  labels:
    app.kubernetes.io/name: sim-llama-8b
    aibox.dev/model: sim-llama-8b
spec:
  selector:
    app.kubernetes.io/name: sim-llama-8b
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
