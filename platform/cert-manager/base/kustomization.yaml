# cert-manager issues the webhook certificates of KServe (and later the gateway).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.3
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesInline:
      crds:
        enabled: true
        keep: true
      # Helm hook Job; Argo CD waits for the Deployments instead.
      startupapicheck:
        enabled: false
      resources:
        requests: {cpu: 10m, memory: 64Mi}
      webhook:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
      cainjector:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
# Digests resolved in CI (make check-image-digests; quay.io is not reachable from the build
# container).
images:
  - name: quay.io/jetstack/cert-manager-controller
    digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
  - name: quay.io/jetstack/cert-manager-webhook
    digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
  - name: quay.io/jetstack/cert-manager-cainjector
    digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
