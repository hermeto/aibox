# kind maps NodePort 30080 to 127.0.0.1:30080 (plain HTTP on localhost).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: aibox
    patch: |-
      - op: replace
        path: /spec/provider/kubernetes/envoyService
        value:
          type: NodePort
          patch:
            type: StrategicMerge
            value:
              spec:
                ports:
                  - port: 80
                    nodePort: 30080
