# Network Load Balancer on port 443; `aibox up` adds the ACM certificate (--tls-cert-arn), which
# makes the NLB terminate TLS there, and restricts the source ranges to the admin CIDRs through
# the root Application. Envoy itself serves plain HTTP behind the NLB.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: aibox
    patch: |-
      - op: replace
        path: /spec/provider/kubernetes/envoyService
        value:
          type: LoadBalancer
          externalTrafficPolicy: Local
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
            service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: aibox
    patch: |-
      - op: replace
        path: /spec/listeners/0/port
        value: 443
