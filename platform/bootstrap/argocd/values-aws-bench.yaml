# Helm values for the Argo CD install performed by `aibox up` on EKS (chart argo-cd 10.12.1).
# The UI is reached with `kubectl port-forward` (no public exposure).
global:
  image:
    tag: v3.6.1@sha256:296e3d74f449b2ce45265613fcb68c18ed7366488360c8ea32f5f2a93d2e5c54
  nodeSelector:
    aibox.dev/role: system
dex:
  enabled: false
notifications:
  enabled: false
redis:
  image:
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
configs:
  params:
    server.insecure: true
  cm:
    kustomize.buildOptions: --enable-helm
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Model servers (KServe LLMInferenceService) are healthy once their Ready condition is true.
    resource.customizations.health.serving.kserve.io_LLMInferenceService: |
      hs = {status = "Progressing", message = "Waiting for the model server"}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" then
            if c.status == "True" then
              hs.status = "Healthy"
            end
            if c.message ~= nil then
              hs.message = c.message
            end
          end
        end
      end
      return hs
