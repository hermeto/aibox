{{- range .Values.apps }}
{{- if or (not .requiresModels) $.Values.modelsReady }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.argocdNamespace }}
  labels:
    app.kubernetes.io/part-of: aibox
    aibox.dev/profile: {{ $.Values.profile }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: {{ .path | default (printf "platform/%s/overlays/%s" .name $.Values.profile) }}
    {{- if and $.Values.runId .tagNodeClassesWithRunId }}
    kustomize:
      patches:
        - target:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
          patch: |-
            - op: add
              path: /spec/tags/run-id
              value: {{ $.Values.runId | quote }}
    {{- else if and (eq .name "gateway") (or $.Values.gateway.tlsCertificateArn $.Values.gateway.sourceRanges) }}
    kustomize:
      patches:
        - target:
            group: gateway.envoyproxy.io
            kind: EnvoyProxy
            name: aibox
          patch: |-
            {{- if $.Values.gateway.tlsCertificateArn }}
            - op: add
              path: /spec/provider/kubernetes/envoyService/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-cert
              value: {{ $.Values.gateway.tlsCertificateArn | quote }}
            - op: add
              path: /spec/provider/kubernetes/envoyService/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-ports
              value: "443"
            {{- end }}
            {{- if $.Values.gateway.sourceRanges }}
            - op: add
              path: /spec/provider/kubernetes/envoyService/loadBalancerSourceRanges
              value: {{ toJson $.Values.gateway.sourceRanges }}
            {{- end }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Custom resources may arrive in the same sync as their CRDs (charts with CRDs).
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
{{- end }}
