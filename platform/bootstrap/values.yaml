# Set by `aibox up` (helm parameters on the root Application).
repoURL: https://github.com/hermeto/aibox.git
targetRevision: main
# Profile overlay rendered for every component: platform/<component>/overlays/<profile>
profile: local
# Set by `aibox up` for cloud profiles; tags Karpenter-launched instances.
runId: ""
# Set by `aibox up` once the profile's model weights are mirrored; components marked
# `requiresModels` (cloud model servers) deploy only then.
modelsReady: false
# Set by `aibox up` for cloud profiles: ACM certificate for the gateway's load balancer and the
# CIDRs allowed to reach it.
gateway:
  tlsCertificateArn: ""
  sourceRanges: []
# Argo CD namespace and project for child Applications.
argocdNamespace: argocd
project: default
# Components, in sync-wave order (CRDs −2, operators −1, workloads ≥ 0). Profiles list
# theirs in values-<profile>.yaml.
apps: []
