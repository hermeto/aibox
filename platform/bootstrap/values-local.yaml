profile: local
apps:
  - name: cert-manager
    namespace: cert-manager
    syncWave: -2
    path: platform/cert-manager/base
  - name: gateway
    namespace: aibox-gateway
    syncWave: -2
  - name: secrets
    namespace: external-secrets
    syncWave: -1
  - name: kserve
    namespace: kserve
    syncWave: -1
    path: platform/kserve/base
  - name: observability
    namespace: observability
    syncWave: -1
  - name: models
    namespace: aibox-models
    syncWave: 0
  - name: serving
    namespace: aibox-serving
    syncWave: 10
